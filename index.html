<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bioraiz - Inicio Replicado</title>
    <style>
.interactive-banner {
    width: 100%;
    padding: 80px 20px;
    background-color: #f3f6f9; /* Fondo gris claro */
    text-align: center;        /* Centra el texto por defecto */
    border-top: 1px solid #e0e0e0;
    
    /* Configuración para forzar el centrado absoluto de todo el contenido */
    display: flex;
    flex-direction: column;
    align-items: center;       /* Centra horizontalmente el título y el párrafo */
    justify-content: center;   /* Centra verticalmente */
}

.banner-description {
    font-family: Arial, sans-serif;
    font-size: 1.1rem;
    line-height: 1.6;
    margin-top: 25px;
    max-width: 650px;          /* Limita el ancho para que el texto no se estire demasiado */
    margin-left: auto;         /* Refuerza el centrado en el eje horizontal */
    margin-right: auto;
    color: #333333;
}

.products-grid {
    max-width: 1200px;
    margin: 50px auto;
    display: flex;          /* Cambia de grid a flex */
    flex-wrap: wrap;        /* Permite que los elementos bajen en celulares */
    justify-content: center; /* Centra el contenido */
    gap: 40px;
    padding: 0 20px;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background-color: #ffffff;
    color: #000000;
}

/* --- MENÚ SUPERIOR DE BIORAÍZ PERFECTAMENTE ALINEADO --- */
.site-header {
    display: flex;
    justify-content: space-between;
    align-items: center; /* Centra verticalmente el menú con el logo */
    padding: 10px 40px;
    border-bottom: 2px solid #d1121d; /* Línea roja delgada de Folicure */
    background-color: #ffffff;
}

/* Ajuste del tamaño del logo para que no deforme el Header */
.site-header img {
    height: 120px; /* Controla la altura máxima de la imagen de Bioraíz */
    width: auto;
    display: block;
}

.main-nav {
    display: flex;
    gap: 25px; /* Espaciado uniforme entre los links */
}

.main-nav a {
    text-decoration: none;
    color: #000000;
    font-weight: bold;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    position: relative;
    padding: 5px 0;
}


}

/* Si se abre en celular, se pone una columna bajo otra automáticamente */
@media (max-width: 768px) {
    .products-grid {
        grid-template-columns: 1fr;
    }
}

.category-card {
    display: flex;
    flex-direction: column;
    align-items: center; /* Centra el título, la foto y el botón entre sí */
    text-align: center;
}

.section-title {
    font-family: 'Arial Black', 'Impact', sans-serif;
    font-size: 2rem;
    text-transform: uppercase;
    margin-bottom: 25px;
}

.image-box {
    width: 100%;
    max-width: 480px;      /* Tamaño máximo en computadoras */
    height: auto;          /* Altura flexible */
    aspect-ratio: 1 / 1;   /* Mantiene el recuadro cuadrado */
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 25px;
    overflow: hidden;
}

.image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;     /* Ajusta la foto sin deformarla */
}
.section-title::before {
    color: #d1121d;
    font-weight: 900;
}
/* --- BOTÓN ANCHO Y CENTRADO --- */
.btn-action {
    display: inline-block;
    background-color: #0b1a30; /* Azul oscuro */
    color: #ffffff;
    text-decoration: none;
    text-transform: uppercase;
    font-size: 0.85rem;
    font-weight: bold;
    padding: 15px 65px; /* Botón ancho e imponente */
    letter-spacing: 1px;
    transition: background-color 0.2s ease;
}

.btn-action:hover {
    background-color: #172d4c;
}

    </style>
</head>
<body>

    <!-- MENÚ SUPERIOR -->
    <header class="site-header">
        <div class="logo-placeholder"><a href="index.html""><img src="Bioraiz.jpg"></div>
        <nav class="main-nav">
            <a href="#">Productos</a>
            <a href="#">Control Caída</a>
            <a href="#">Control Caspa</a>
            <a href="#">Vende nuestros productos</a>
        </nav>
    </header>


    <main class="products-grid">
        
        
        <section class="category-card">
            <h2 class="section-title">Control Caída</h2>
            <div class="image-box">
                <img src="https://cdn.shopify.com/s/files/1/0775/4471/8614/files/shampoo_control_anticaida_-_holisstree.jpg?v=1737506514">
            </div>
            <a href="#" class="btn-action">Conoce Más</a>
        </section>

        

    </main>

   
    <section class="interactive-banner">
        <h2 class="section-title">El producto perfecto para ti</h2>
        <p class="banner-description">
            ¿Sabes que Bioraiz funciona pero no cuál es el adecuado para ti?<br><br>
            Descúbrelo con unas sencillas preguntas.
        </p>
    </section>


    <section style="margin: 60px 0; text-align: center;">
        <h2 class="section-title">Artículos y Consejos</h2>
    </section>

</body>
</html>
